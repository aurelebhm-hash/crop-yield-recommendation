# ============================================================
# PIPELINE CI - CROP YIELD
# ============================================================
# Pipeline d'intégration continue :
# 1. récupération du projet et des fichiers Git LFS ;
# 2. installation des dépendances ;
# 3. exécution des tests API ;
# 4. construction de l'image Docker si les tests réussissent.

name: CI - Crop Yield


# ============================================================
# DÉCLENCHEURS
# ============================================================

on:
  push:
  pull_request:


jobs:

  # ==========================================================
  # JOB 1 - TESTS API
  # ==========================================================

  tests:

    name: Tests API

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Récupération du dépôt
      # ------------------------------------------------------
      # lfs: true est important car notre modèle .joblib
      # est stocké avec Git LFS.

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      # ------------------------------------------------------
      # Vérification Git LFS
      # ------------------------------------------------------

      - name: Pull Git LFS files
        run: |
          git lfs pull


      # ------------------------------------------------------
      # Vérification du modèle
      # ------------------------------------------------------
      # Cette étape permet de vérifier dans les logs que
      # le vrai fichier du modèle a bien été téléchargé.

      - name: Check model file
        run: |
          ls -lh models/crop_yield_pipeline.joblib
          git lfs ls-files


      # ------------------------------------------------------
      # Installation de Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # Installation des dépendances
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # Tests automatisés
      # ------------------------------------------------------

      - name: Run tests
        run: |
          python -m pytest tests/ -v


  # ==========================================================
  # JOB 2 - BUILD DOCKER
  # ==========================================================

  docker-build:

    name: Build Docker image

    runs-on: ubuntu-latest

    # Le build ne démarre que si tous les tests réussissent.
    needs: tests

    steps:

      # ------------------------------------------------------
      # Récupération du dépôt + modèle Git LFS
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      # ------------------------------------------------------
      # Récupération explicite du modèle
      # ------------------------------------------------------

      - name: Pull Git LFS files
        run: |
          git lfs pull


      # ------------------------------------------------------
      # Construction de l'image Docker
      # ------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build -t crop-yield-api .